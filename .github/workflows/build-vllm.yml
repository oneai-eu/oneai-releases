name: Build OneStack vLLM Image

on:
  workflow_dispatch:
    inputs:
      vllm_version:
        description: 'vLLM version tag (e.g., v0.20.1)'
        required: true
        default: 'v0.20.1'
      vllm_digest:
        description: 'Optional base digest pin incl. @ (e.g. @sha256:...); empty = tag only'
        required: false
        default: ''
      tag_latest:
        description: 'Also move the :latest tag?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      context:
        description: 'Build context: docker/vllm (from upstream) or docker/vllm-overlay (patches on top of an existing onestack-vllm image)'
        required: true
        default: 'docker/vllm'
        type: choice
        options:
          - 'docker/vllm'
          - 'docker/vllm-overlay'
      base_image:
        description: 'Overlay only: full base reference incl. digest (e.g. ghcr.io/oneai-eu/onestack-vllm:v0.32.0@sha256:...)'
        required: false
        default: ''
      tag_suffix:
        description: 'Suffix for the version tag (e.g. -p1 gives v0.32.0-p1); empty = plain version tag'
        required: false
        default: ''
      push:
        description: 'Push image to GHCR?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: oneai-eu/onestack-vllm

jobs:
  build-and-push:
    name: Build vLLM + orjson + Qwen3.5 LoRA patch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check overlay inputs
        if: inputs.context == 'docker/vllm-overlay'
        env:
          BASE_IMAGE: ${{ inputs.base_image }}
          TAG_SUFFIX: ${{ inputs.tag_suffix }}
          TAG_LATEST: ${{ inputs.tag_latest }}
        run: |
          case "$BASE_IMAGE" in
            ghcr.io/oneai-eu/onestack-vllm:*@sha256:*) ;;
            *) echo "overlay needs base_image ghcr.io/oneai-eu/onestack-vllm:<tag>@sha256:<digest>"; exit 1 ;;
          esac
          [ -n "$TAG_SUFFIX" ] || { echo "overlay needs a tag_suffix, so it never overwrites the plain version tag"; exit 1; }
          [ "$TAG_LATEST" = "false" ] || { echo "overlay must not move :latest"; exit 1; }

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          push: ${{ inputs.push == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.vllm_version }}${{ inputs.tag_suffix }}
            ${{ inputs.tag_latest == 'true' && format('{0}/{1}:latest', env.REGISTRY, env.IMAGE_NAME) || '' }}
          build-args: |
            VLLM_VERSION=${{ inputs.vllm_version }}
            VLLM_DIGEST=${{ inputs.vllm_digest }}
            BASE_IMAGE=${{ inputs.base_image }}
          labels: |
            org.opencontainers.image.base=${{ inputs.context == 'docker/vllm-overlay' && inputs.base_image || format('vllm/vllm-openai:{0}{1}', inputs.vllm_version, inputs.vllm_digest) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
