name: Build OneStack vLLM Image

on:
  workflow_dispatch:
    inputs:
      vllm_version:
        description: 'vLLM version tag (e.g., v0.20.1)'
        required: true
        default: 'v0.20.1'
      vllm_digest:
        description: 'Optional base digest pin incl. @ (e.g. @sha256:...); empty = tag only'
        required: false
        default: ''
      tag_latest:
        description: 'Also move the :latest tag?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      push:
        description: 'Push image to GHCR?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: oneai-eu/onestack-vllm

jobs:
  build-and-push:
    name: Build vLLM + orjson + Qwen3.5 LoRA patch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: docker/vllm
          push: ${{ inputs.push == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.vllm_version }}
            ${{ inputs.tag_latest == 'true' && format('{0}/{1}:latest', env.REGISTRY, env.IMAGE_NAME) || '' }}
          build-args: |
            VLLM_VERSION=${{ inputs.vllm_version }}
            VLLM_DIGEST=${{ inputs.vllm_digest }}
          labels: |
            org.opencontainers.image.base=vllm/vllm-openai:${{ inputs.vllm_version }}${{ inputs.vllm_digest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
